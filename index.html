<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230A0A0B'/><circle cx='16' cy='16' r='3' fill='%23C9B06B'/><circle cx='6' cy='8' r='2' fill='%23C9B06B'/><circle cx='26' cy='9' r='2' fill='%23C9B06B'/><circle cx='25' cy='25' r='2' fill='%23C9B06B'/><circle cx='7' cy='24' r='2' fill='%23C9B06B'/><g stroke='%23C9B06B' stroke-width='1' opacity='0.6'><line x1='16' y1='16' x2='6' y2='8'/><line x1='16' y1='16' x2='26' y2='9'/><line x1='16' y1='16' x2='25' y2='25'/><line x1='16' y1='16' x2='7' y2='24'/></g></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000000;
      --bg-2: #0C0C0E;
      --bg-3: #151518;
      --gold: #C9B06B;
      --gold-bright: #E6D29A;
      --gold-dark: #8A7440;
      --green: #A6C24B;          /* live-status / mesh cue only */
      --text: #F3F0E9;
      --muted: #9D998E;
      --dim: rgba(243, 240, 233, 0.60);
      --line: rgba(255, 255, 255, 0.10);
      --line-2: rgba(255, 255, 255, 0.06);
      --line-gold: rgba(201, 176, 107, 0.28);
      --disp: 'Space Grotesk', system-ui, sans-serif;
      --body: 'Inter', system-ui, sans-serif;
      --maxw: 1180px;
    }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      opacity: 0;
      animation: boot 600ms ease forwards;
    }
    @keyframes boot { to { opacity: 1; } }

    a { color: inherit; text-decoration: none; }

    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 clamp(20px, 5vw, 48px); }

    h1, h2, h3, .disp { font-family: var(--disp); font-weight: 700; letter-spacing: -0.01em; }

    /* kicker / bracketed section index */
    .kick { font-family: var(--disp); font-size: 12px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
    .sec-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: clamp(28px, 4vw, 48px); }
    .sec-head h2 { font-size: clamp(1.9rem, 5.5vw, 3.4rem); line-height: 1.02; text-transform: uppercase; }
    .sec-head .idx { font-family: var(--disp); font-size: 13px; color: var(--muted); letter-spacing: 0.1em; flex-shrink: 0; padding-top: 8px; }
    .sec-head .lead { color: var(--dim); max-width: 460px; margin-top: 14px; font-size: 0.98rem; }

    section { position: relative; }
    .block { padding: clamp(64px, 9vw, 130px) 0; border-top: 1px solid var(--line-2); }

    /* mesh-node brand glyph */
    .glyph { width: 22px; height: 22px; flex-shrink: 0; }

    /* ───────── NAV ───────── */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(10, 10, 11, 0.86);
      backdrop-filter: saturate(140%) blur(8px);
      -webkit-backdrop-filter: saturate(140%) blur(8px);
      border-bottom: 1px solid var(--line-2);
    }
    .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 62px; }
    .nav .brand { display: flex; align-items: center; gap: 10px; font-family: var(--disp); font-weight: 700; letter-spacing: 0.16em; font-size: 14px; text-transform: uppercase; }
    .nav .links { display: flex; align-items: center; gap: 30px; }
    .nav .links a { font-family: var(--disp); font-size: 13px; letter-spacing: 0.06em; color: var(--muted); transition: color 150ms ease; }
    .nav .links a:hover { color: var(--text); }
    .nav .right { display: flex; align-items: center; gap: 18px; }
    .nav .tag { font-family: var(--disp); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 7px; }
    .led { width: 7px; height: 7px; background: var(--gold-bright); border-radius: 50%; box-shadow: 0 0 8px var(--gold-bright); animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
    .btn {
      font-family: var(--disp); font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
      background: var(--gold); color: #0A0A0B; padding: 9px 18px; border: 1px solid var(--gold);
      transition: background 150ms ease, color 150ms ease; white-space: nowrap;
    }
    .btn:hover { background: var(--gold-bright); border-color: var(--gold-bright); }
    .btn.ghost { background: transparent; color: var(--gold); }
    .btn.ghost:hover { background: var(--gold); color: #0A0A0B; }
    @media (max-width: 760px) { .nav .links { display: none; } }
    @media (max-width: 520px) { .nav .tag { display: none; } }

    /* ───────── HERO ───────── */
    .hero { padding: clamp(48px, 8vw, 96px) 0 clamp(40px, 6vw, 72px); text-align: center; overflow: hidden; }
    .hero-stage { position: relative; display: flex; flex-direction: column; align-items: center; }
    .ripples { position: absolute; top: 46%; left: 50%; width: 1px; height: 1px; transform: translate(-50%, -50%); z-index: 0; pointer-events: none; }
    .ripples i {
      position: absolute; top: 50%; left: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px;
      border: 1.5px solid rgba(201,176,107,0.55); border-radius: 50%; opacity: 0;
      animation: ripple 4.6s ease-out infinite;
    }
    .ripples i:nth-child(2) { animation-delay: 1.1s; }
    .ripples i:nth-child(3) { animation-delay: 2.2s; }
    .ripples i:nth-child(4) { animation-delay: 3.3s; }
    @keyframes ripple { 0%{ transform: scale(0.12); opacity: 0.65; } 70%{ opacity: 0.12; } 100%{ transform: scale(3.7); opacity: 0; } }
    .hero-scope {
      position: absolute; top: 46%; left: 50%; width: 660px; height: 660px; max-width: 150vw;
      transform: translate(-50%, -50%); z-index: 0; pointer-events: none; opacity: 0.5;
    }
    .hero-mark { position: relative; z-index: 1; width: 100%; max-width: 740px; aspect-ratio: 2400 / 1371; margin: 0 auto; overflow: visible; }
    .hero-mark .glitch-base, .hero-mark .glitch-l {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; object-position: center; display: block;
    }
    .hero-mark .glitch-base { filter: drop-shadow(0 0 18px rgba(201,176,107,0.28)); }
    .hero-mark .glitch-l {
      background: center / contain no-repeat url('krath-logo.png');
      opacity: 0; pointer-events: none; will-change: transform, clip-path, opacity;
    }
    .hero-mark .glitch-l.a { filter: brightness(1.7) saturate(0.4); }
    .hero-mark .glitch-l.b { filter: brightness(0.9) contrast(1.4); }
    .glitch .glitch-l.a { animation: glitchA 7s steps(1) infinite; }
    .glitch .glitch-l.b { animation: glitchB 6.3s steps(1) infinite; }
    @keyframes glitchA {
      0%, 90%, 100% { opacity: 0; transform: translate3d(0,0,0); clip-path: inset(0 0 100% 0); }
      90.6% { opacity: .9; transform: translate3d(-8px,0,0); clip-path: inset(10% 0 62% 0); }
      91.4% { opacity: .9; transform: translate3d(10px,0,0); clip-path: inset(54% 0 16% 0); }
      92.2% { opacity: .7; transform: translate3d(-5px,0,0); clip-path: inset(34% 0 42% 0); }
      93%   { opacity: 0; }
    }
    @keyframes glitchB {
      0%, 87%, 100% { opacity: 0; transform: translate3d(0,0,0); clip-path: inset(100% 0 0 0); }
      87.8% { opacity: .65; transform: translate3d(9px,0,0); clip-path: inset(70% 0 6% 0); }
      88.6% { opacity: .65; transform: translate3d(-10px,0,0); clip-path: inset(20% 0 52% 0); }
      89.4% { opacity: 0; }
    }
    .scope-sweep { transform-box: view-box; transform-origin: 330px 330px; animation: scopeSweep 7s linear infinite; }
    @keyframes scopeSweep { to { transform: rotate(360deg); } }
    .hero-line { position: relative; z-index: 1; margin: 30px auto 0; max-width: 620px; color: var(--text); font-size: clamp(1.05rem, 2.4vw, 1.4rem); line-height: 1.45; }
    .hero-line b { color: var(--gold); font-weight: 600; }
    .hero-cta { position: relative; z-index: 1; margin-top: 32px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .hero-meta { position: relative; z-index: 1; margin-top: 40px; display: flex; gap: 8px 18px; justify-content: center; flex-wrap: wrap; font-family: var(--disp); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .hero-meta .s { color: var(--gold-dark); }

    /* ───────── DEVICE SHOWCASE ───────── */
    .device { padding-bottom: clamp(56px, 8vw, 100px); }
    .device-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: clamp(22px, 3vw, 34px); }
    .device-head .device-meta { font-family: var(--disp); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .device-shot { display: block; width: 100%; height: auto; }
    .device-caption { margin-top: clamp(18px, 2.6vw, 28px); color: var(--dim); font-size: 1rem; line-height: 1.6; max-width: 680px; }
    .device-caption b { color: var(--text); font-weight: 600; }

    /* ───────── ADVANTAGES GRID ───────── */
    .adv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line); }
    .adv {
      padding: clamp(22px, 3vw, 34px) clamp(0px, 2vw, 34px) clamp(22px, 3vw, 34px) 0;
      border-bottom: 1px solid var(--line);
    }
    .adv:nth-child(odd) { padding-right: clamp(22px, 4vw, 56px); }
    .adv:nth-child(even) { padding-left: clamp(22px, 4vw, 56px); border-left: 1px solid var(--line); }
    .adv .g { width: 26px; height: 26px; margin-bottom: 16px; }
    .adv h3 { font-size: 1.18rem; margin-bottom: 8px; }
    .adv p { color: var(--muted); font-size: 0.95rem; line-height: 1.55; }
    @media (max-width: 680px) {
      .adv-grid { grid-template-columns: 1fr; }
      .adv:nth-child(even) { padding-left: 0; border-left: none; }
      .adv:nth-child(odd) { padding-right: 0; }
    }

    /* operators strip */
    .ops { margin-top: clamp(40px, 5vw, 64px); padding-top: clamp(28px,3vw,40px); border-top: 1px solid var(--line-2); text-align: center; }
    .ops .l { font-family: var(--disp); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
    .ops .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 26px; font-family: var(--disp); font-weight: 500; letter-spacing: 0.08em; color: var(--gold-dark); font-size: clamp(0.95rem, 2vw, 1.25rem); text-transform: uppercase; }

    /* ───────── PRODUCTS ───────── */
    .prod-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .prod { border: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; }
    .prod .pn { font-family: var(--disp); font-size: 12px; color: var(--muted); letter-spacing: 0.1em; padding: 14px 16px 0; }
    /* product image slot (swap for product photo: see IMAGE SLOTS 3-5) */
    .prod .shot { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; position: relative; margin: 8px 16px 0; overflow: hidden; background: radial-gradient(circle at 50% 40%, rgba(201,176,107,0.05), transparent 60%); }
    .prod .shot svg { width: 64%; height: 64%; opacity: 0.92; }
    .prod .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .prod .meta { padding: 18px 16px 22px; border-top: 1px solid var(--line-2); margin-top: 16px; }
    .prod .meta h3 { font-size: 1.12rem; text-transform: uppercase; letter-spacing: 0.02em; }
    .prod .meta p { color: var(--muted); font-size: 0.92rem; margin-top: 7px; line-height: 1.5; }
    @media (max-width: 760px) { .prod-grid { grid-template-columns: 1fr; } }

    /* ───────── MESH / HOW IT WORKS ───────── */
    .steps { display: flex; flex-direction: column; gap: clamp(48px, 7vw, 96px); }
    .step { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: clamp(24px, 4vw, 56px); align-items: center; }
    .step:nth-child(even) .step-viz { order: -1; }
    .step .num { font-family: var(--disp); font-size: 13px; color: var(--gold); letter-spacing: 0.18em; }
    .step h3 { font-size: clamp(1.3rem, 3vw, 1.9rem); margin: 10px 0 14px; line-height: 1.1; text-transform: uppercase; }
    .step p { color: var(--muted); font-size: 0.98rem; line-height: 1.6; max-width: 420px; }
    .step-viz { border: 1px solid var(--line); background: var(--bg-2); padding: 8px; position: relative; }
    .step-viz svg { width: 100%; height: auto; display: block; }
    @media (max-width: 820px) {
      .step { grid-template-columns: 1fr; gap: 22px; }
      .step:nth-child(even) .step-viz { order: 0; }
    }

    /* mesh diagram primitives */
    .mnode { fill: var(--bg); stroke: var(--gold); stroke-width: 1.4; }
    .mnode.hot { fill: rgba(201,176,107,0.14); }
    .mnode.air { stroke: var(--gold-bright); }
    .mlabel { fill: var(--gold); font-family: var(--disp); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; }
    .mlabel.dim { fill: var(--muted); font-size: 9.5px; letter-spacing: 0.08em; }
    .mlink { stroke: var(--gold); stroke-width: 1; stroke-opacity: 0.45; stroke-dasharray: 3 6; animation: flow 2.6s linear infinite; }
    .mlink.air { stroke: var(--gold-bright); stroke-opacity: 0.5; }
    @keyframes flow { to { stroke-dashoffset: -90; } }
    .mring { fill: none; stroke: var(--gold); stroke-opacity: 0.5; transform-box: fill-box; transform-origin: center; animation: mring 4s ease-out infinite; }
    .mring.air { stroke: var(--gold-bright); }
    @keyframes mring { 0%{ transform: scale(0.35); opacity: 0.55; } 100%{ transform: scale(1); opacity: 0; } }
    .mdot { fill: var(--gold); }

    /* ───────── STATS + FIELD ───────── */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
    .stat { background: var(--bg); padding: clamp(22px, 3vw, 36px) 16px; text-align: center; }
    .stat .v { font-family: var(--disp); font-size: clamp(1.5rem, 3.4vw, 2.3rem); font-weight: 700; color: var(--gold); line-height: 1; }
    .stat .k { margin-top: 10px; font-family: var(--disp); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    @media (max-width: 680px) { .stats { grid-template-columns: 1fr 1fr; } }

    .field {
      margin-top: 18px; position: relative; min-height: clamp(280px, 42vw, 460px);
      border: 1px solid var(--line); overflow: hidden;
      background: linear-gradient(90deg, rgba(8,8,9,0.92) 0%, rgba(8,8,9,0.5) 45%, rgba(8,8,9,0.1) 100%), linear-gradient(0deg, rgba(8,8,9,0.78), transparent 42%), url('node-field.png');
      background-size: cover; background-position: center right;
      display: flex; align-items: flex-end;
    }
    .field::before { display: none; }
    .field .ovl { position: relative; z-index: 1; padding: clamp(24px, 4vw, 48px); }
    .field .ovl .k { font-family: var(--disp); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); }
    .field .ovl h3 { font-size: clamp(1.5rem, 4.4vw, 2.8rem); line-height: 1.05; margin-top: 12px; max-width: 620px; text-transform: uppercase; }
    .field .ovl p { color: var(--dim); margin-top: 12px; max-width: 480px; }

    /* ───────── ROADMAP ───────── */
    .road { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); }
    .ph { padding: clamp(22px, 2.6vw, 32px); border-right: 1px solid var(--line); position: relative; }
    .ph:last-child { border-right: none; }
    .ph .t { font-family: var(--disp); font-size: 11px; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
    .ph .nm { font-family: var(--disp); font-weight: 700; font-size: 1.1rem; margin: 10px 0 6px; color: var(--gold); text-transform: uppercase; }
    .ph .here { display: inline-block; font-family: var(--disp); font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #0A0A0B; background: var(--gold); padding: 2px 7px; margin-bottom: 10px; }
    .ph p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    @media (max-width: 820px) { .road { grid-template-columns: 1fr 1fr; } .ph:nth-child(2){border-right:none;} .ph:nth-child(1),.ph:nth-child(2){border-bottom:1px solid var(--line);} }
    @media (max-width: 460px) { .road { grid-template-columns: 1fr; } .ph { border-right:none; border-bottom:1px solid var(--line);} .ph:last-child{border-bottom:none;} }

    /* ───────── FAQ ───────── */
    .faq details { border-top: 1px solid var(--line); }
    .faq details:last-child { border-bottom: 1px solid var(--line); }
    .faq summary {
      list-style: none; cursor: pointer; padding: 22px 0; display: flex; align-items: center; gap: 18px;
      font-family: var(--disp); font-size: clamp(1rem, 2.2vw, 1.25rem); font-weight: 500;
    }
    .faq summary::-webkit-details-marker { display: none; }
    .faq summary .q { color: var(--muted); font-size: 0.85em; min-width: 38px; }
    .faq summary .x { margin-left: auto; color: var(--gold); font-size: 1.5rem; line-height: 1; transition: transform 200ms ease; }
    .faq details[open] summary .x { transform: rotate(45deg); }
    .faq .a { padding: 0 0 24px 56px; color: var(--muted); max-width: 720px; line-height: 1.62; }

    /* ───────── LOOKING FOR ───────── */
    .look-lead { color: var(--dim); max-width: 560px; margin-bottom: clamp(24px, 3vw, 36px); font-size: 0.98rem; }
    .look { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .look .item { position: relative; display: block; background: var(--bg-2); border: 1px solid var(--line); padding: clamp(22px, 2.6vw, 30px); padding-bottom: 50px; overflow: hidden; transition: transform 220ms ease, border-color 220ms ease, background 220ms ease, box-shadow 220ms ease; -webkit-tap-highlight-color: transparent; }
    .look .item::before { content: ''; position: absolute; left: 0; top: 0; height: 2px; width: 0; background: var(--gold); transition: width 280ms ease; }
    .look .item .ln { font-family: var(--disp); font-size: 12px; letter-spacing: 0.18em; color: var(--gold-dark); }
    .look .item h3 { font-family: var(--disp); font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; margin: 12px 0 8px; color: var(--text); }
    .look .item p { color: var(--muted); font-size: 0.95rem; line-height: 1.55; }
    .look .item .arrow { position: absolute; right: clamp(18px,2.4vw,26px); bottom: 18px; font-family: var(--disp); color: var(--gold); opacity: 0.55; transition: opacity 220ms ease, transform 220ms ease; }
    @media (hover: hover) and (pointer: fine) {
      .look .item:hover { transform: translateY(-4px); border-color: var(--line-gold); background: rgba(201,176,107,0.05); box-shadow: 0 16px 40px rgba(0,0,0,0.55); }
      .look .item:hover::before { width: 100%; }
      .look .item:hover .ln { color: var(--gold); }
      .look .item:hover .arrow { opacity: 1; transform: translateX(5px); }
    }
    @media (max-width: 680px) { .look { grid-template-columns: 1fr; } }

    /* ───────── CTA BAND ───────── */
    .cta { background: var(--gold); color: #0A0A0B; text-align: center; padding: clamp(56px, 9vw, 110px) 0; }
    .cta-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .cta h2 { font-size: clamp(2rem, 6vw, 4rem); line-height: 0.98; text-transform: uppercase; }
    .cta p { margin: 14px auto 0; max-width: 540px; font-size: 1.1rem; font-weight: 500; color: #1A1608; }
    .cta .btn { display: inline-block; margin-top: 30px; background: #0A0A0B; color: var(--gold); border-color: #0A0A0B; font-size: 14px; padding: 14px 28px; }
    .cta .btn:hover { background: #1c1c1f; color: var(--gold-bright); }

    /* ───────── CONTACT ───────── */
    .contact { text-align: center; }
